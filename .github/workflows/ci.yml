name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests & migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Migration smoke test (empty DB -> upgrade -> downgrade)
        run: |
          DATABASE_URL=sqlite:////tmp/ci_migrate.db alembic upgrade head
          DATABASE_URL=sqlite:////tmp/ci_migrate.db alembic current
          DATABASE_URL=sqlite:////tmp/ci_migrate.db alembic downgrade base
          DATABASE_URL=sqlite:////tmp/ci_migrate.db alembic upgrade head

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Type-check and build
        run: npm run build
