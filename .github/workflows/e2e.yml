# Browser E2E tests (Playwright). Kept in a separate workflow so a heavy
# browser install or flaky UI step never blocks the basic backend/frontend CI.
name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Playwright config launches the backend through the project venv
      # (.venv/bin/python), so create exactly that layout.
      - name: Install backend into venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci --no-fund --no-audit
        working-directory: frontend

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
